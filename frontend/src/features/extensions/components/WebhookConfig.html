<div>
	<p style="margin: 0 0 8px 0;">
		Each selected event is sent as a <span style="font-family: monospace;">POST</span> request to:
	</p>
	<div data-cb="urlDisplay"
		style="font-family: monospace; margin-bottom: 12px; padding: 4px 6px; border: 1px solid #808080; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
	</div>

	<div data-cb="eventsList" style="margin-bottom: 15px;">
		<label data-cb="eventRow" style="display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; cursor: pointer;">
			<input type="checkbox" data-cb="eventCheckbox" />
			<span>
				<span data-cb="eventLabel" style="font-weight: bold;"></span>
				<span data-cb="eventId" style="font-family: monospace; font-size: 0.82em; margin-left: 5px;"></span>
				<span data-cb="eventDescription" style="display: block; font-size: 0.82em; color: #666;"></span>
			</span>
		</label>
	</div>

	<div style="display: flex; justify-content: flex-end; gap: 8px;">
		<button type="button" class="ui-btn" data-cb="btnSave">Save</button>
		<button type="button" class="ui-btn" data-cb="btnCancel">Cancel</button>
	</div>
</div>
